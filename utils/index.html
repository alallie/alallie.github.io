<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="Private browser-based utilities for everyday calculations.">
  <title>Utilities / Launchpad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('launchpad.theme') || 'light';
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <script src="../app.js" defer></script>
</head>
<body class="utilities-page">
  <div class="page-shell">
    <header class="topbar">
      <a class="wordmark" href="../" aria-label="Launchpad home">
        <span class="wordmark-mark" aria-hidden="true">+</span>
        <span>launchpad</span>
      </a>
      <div class="topbar-meta">
        <a class="topbar-link" href="../">Home</a>
        <button class="icon-button" id="settings-button" type="button" aria-label="Open settings" aria-controls="settings-dialog" aria-haspopup="dialog">Settings</button>
      </div>
    </header>

    <main>
      <section class="subpage-heading" aria-labelledby="utilities-heading">
        <p class="section-kicker">Browser tools</p>
        <h1 id="utilities-heading">Utilities</h1>
        <p>Small tools for the things that come up.</p>
      </section>
      <section class="utilities-section utilities-page-section" aria-labelledby="utilities-heading">
        <div class="utilities-grid" id="utilities-grid"></div>
      </section>
    </main>

    <footer class="footer"><span>launchpad / utilities</span><a class="topbar-link" href="../">Back to start</a></footer>
  </div>

  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-heading">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">Personalize</p>
        <h2 id="settings-heading">Settings</h2>
      </div>
      <button class="icon-button" id="close-settings" type="button" aria-label="Close settings">Close</button>
    </div>
    <div class="settings-content">
      <fieldset>
        <legend>Appearance</legend>
        <div class="theme-options" id="theme-options"></div>
      </fieldset>
      <fieldset>
        <legend>Custom search engines</legend>
        <p class="field-hint">Add a URL with <code>{query}</code> where your search should go.</p>
        <form class="custom-engine-form" id="custom-engine-form">
          <label><span>Name</span><input id="custom-engine-name" type="text" maxlength="30" placeholder="My search"></label>
          <label><span>URL template</span><input id="custom-engine-url" type="url" placeholder="https://example.com/?q={query}"></label>
          <button class="button button-dark" type="submit">Add engine</button>
        </form>
        <div class="custom-engine-list" id="custom-engine-list"></div>
      </fieldset>
    </div>
  </dialog>
</body>
</html>
